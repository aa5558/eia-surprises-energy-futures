[project]
name = "transport-energy-quant"
version = "0.1.0"
description = "Do EIA gasoline-demand and inventory surprises predict energy futures returns after the release? A point-in-time research codebase."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "xlrd>=2.0.1",        # EIA bulk history files are legacy .xls
]

[project.optional-dependencies]
# Installed only after the Databento data budget is approved (see docs/02_*).
vendor = ["databento>=0.50"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transport_energy"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests on synthetic data (no network)",
    "network: tests that hit external endpoints (deselected by default)",
]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM"]
ignore = [
    "PD008",  # .at / .iat are the right tools for scalar lookups
    "PD009",
    "PD010",  # .pivot raises on duplicates; .pivot_table would silently aggregate them
    "PD013",  # .stack is clearer than .melt for wide-to-long on an index
]
